# docker compose up --build   →  http://localhost:4000
# Requires JWT_SECRET in the environment or in a .env file next to this one.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: entrepreneur_network
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set — generate one with: node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
    ports:
      - "4000:4000"

volumes:
  mongo-data:
